name: Build Release Binaries

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            runner: ubuntu-latest
          # 32-bit ARM (Raspberry Pi on a 32-bit OS, older ARM NAS boxes) and
          # riscv64. Added 2026-07-28: WolfStack's installer refuses to compile
          # on a user's machine during an upgrade, so any architecture without
          # a published binary silently stops receiving updates. Verified to
          # compile clean for both targets before adding.
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
            runner: ubuntu-latest
          - target: riscv64gc-unknown-linux-musl
            arch: riscv64
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        # `--locked` uses the published Cargo.lock from crates.io so the
        # install isn't broken by upstream crate churn. Pinned to 0.2.5
        # — cross-rs git HEAD started pulling `directories v6` / `dirs-sys
        # v0.5` whose `windows-sys` constraint doesn't resolve on
        # crates.io and broke the v0.5.26 release build.
        run: cargo install cross --version 0.2.5 --locked

      - name: Build static binaries
        run: cross build --release --target ${{ matrix.target }}

      - name: Get version
        id: version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*\"\(.*\)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wolfnet dist/wolfnet-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/wolfnetctl dist/wolfnetctl-${{ matrix.arch }}
          chmod +x dist/wolfnet-${{ matrix.arch }} dist/wolfnetctl-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolfnet-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*\"\(.*\)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        # WolfStack's setup.sh verifies downloaded WolfNet binaries against
        # this file before installing them and running them as root. Without
        # it published here, that check can only warn and install unverified.
        run: |
          cd dist
          sha256sum wolfnet-* wolfnetctl-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.version }}"

          # Delete existing release if it exists (update scenario)
          gh release delete "$VERSION" --yes 2>/dev/null || true
          git push --delete origin "$VERSION" 2>/dev/null || true

          # Create release with binaries
          gh release create "$VERSION" \
            --title "WolfNet $VERSION" \
            --notes "Prebuilt static binaries for Linux x86_64, aarch64 (ARM64/Raspberry Pi 4+), armv7 (32-bit ARM) and riscv64. Verify with \`sha256sum -c SHA256SUMS\`." \
            dist/wolfnet-x86_64 \
            dist/wolfnet-aarch64 \
            dist/wolfnet-armv7 \
            dist/wolfnet-riscv64 \
            dist/wolfnetctl-x86_64 \
            dist/wolfnetctl-aarch64 \
            dist/wolfnetctl-armv7 \
            dist/wolfnetctl-riscv64 \
            dist/SHA256SUMS
